<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>if(location.protocol==="file:")document.addEventListener("DOMContentLoaded",function(){document.body.innerHTML="<div style=\"max-width:560px;margin:60px auto;padding:24px;font:17px/1.6 system-ui,Segoe UI,sans-serif;border:2px solid #c98a00;border-radius:14px;background:#fff8e6;color:#1d2130\"><h2 style=\"margin-top:0\">Сервис открыт неправильно</h2><p>Эта страница открыта как файл с диска, поэтому вход, регистрация и розыгрыши не работают.</p><ol><li>Закройте эту вкладку.</li><li>В папке сервиса дважды щёлкните файл <b>«Запустить сервис.bat»</b>.</li><li>Откроется чёрное окно (не закрывайте его) и браузер с адресом <b>http://localhost:3000</b>.</li></ol><p>Если сервис уже запущен, просто перейдите по адресу <a href=\"http://localhost:3000\">http://localhost:3000</a>.</p></div>"})</script>
  <title>Тестовая оплата</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap" style="max-width:480px">
  <header class="top"><a class="logo" href="/">Честный<span>Розыгрыш</span></a></header>
  <div class="card" style="text-align:center">
    <p><span class="badge demo">ТЕСТОВАЯ ОПЛАТА</span></p>
    <h2>Имитация платёжной страницы</h2>
    <p class="small muted">Платёжная система не подключена, поэтому вместо ЮKassa открылась эта страница. Деньги не списываются. В рабочем режиме здесь будет настоящая форма оплаты картой, СБП, SberPay и т.д.</p>
    <div id="info"><div class="spinner"></div></div>
    <div id="err" class="bad small"></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
      <button class="btn primary big" id="ok" type="button">Оплатить (тест)</button>
      <button class="btn big" id="no" type="button">Отменить</button>
    </div>
  </div>
</div>
<script src="/nav.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id');
  ME.then(async (me) => {
    if (!me.user) return location.replace('/login.html');
    try {
      const p = await api('/api/payments/' + id);
      document.getElementById('info').innerHTML = `<p>Тариф: <b>${p.plan}</b><br>К оплате: <b style="font-size:24px">${Number(p.amount).toLocaleString('ru-RU')} ₽</b></p>`;
      if (p.status !== 'pending') location.replace('/account.html?payment=' + id);
    } catch (e) { document.getElementById('err').textContent = e.message; }
  });
  async function finish(success) {
    try {
      await api(`/api/payments/${id}/test`, { success });
      location.replace('/account.html?payment=' + id);
    } catch (e) { document.getElementById('err').textContent = e.message; }
  }
  document.getElementById('ok').onclick = () => finish(true);
  document.getElementById('no').onclick = () => finish(false);
</script>
</body>
</html>
